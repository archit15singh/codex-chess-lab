name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-corpus.txt
      - run: node --test tests/browser_collector.test.mjs
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q chesslab
